# 一个 bundle（= 插件卡），两个组件（= 两个模块各一行）。
#
# 行 id **故意短于包名**：宿主组件行会同时渲染 `rowId` 与 `moduleName`，
# 两者相同就出现重复文字（真机截图 patched 前就是两行一样的 `dsh-wsl-docker-ports`）。
# 行 id 同时是 settings 命名空间 ⇒ 改它必须同步 `src/client/settings-pipe.ts` 与 profile 的 config 块。
- insert:
    - id: wsl-ports
      name: dsh-wsl-docker-ports

- insert:
    - id: wsl-containers
      name: dsh-wsl-docker-containers