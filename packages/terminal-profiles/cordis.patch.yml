# Bundle patch 层：「能被宿主加载的清单」四件套之二（Spec 002 / 宿主 0.2.0-rc.2）
#
# 依据（2026-10-09 集成方只读核对，两处实物）：
#   ① 本机已装第三方插件 `@xxxyz/dsh-mcp-manager` v2.4.0 的 `cordis.patch.yml` —— 形状同构：
#      顶层是数组 ⇒ 一行 `- insert:` ⇒ 行列表，每行 `id` + `name`。
#   ② 官方开发文档「第一个插件 · 注册到 cordis.yml」：`- insert:` / `- id` / `- name`
#      （https://deepseek-harness.github.io/deepseek-harness/develop/basic/）。
#
# 生效路径（样板包的文件头注释自述，与本仓 stack-decision.md 的清单审计一致）：
#   `dsh plugin add <本包>` 读 package.json 的 `dsh.bundle.patch` 声明 ⇒ 把本包并入 bundle 栈
#   ⇒ profile 启动时合并本文件 ⇒ 本行被 insert 进来。**不需要手改任何 profile 文件。**
#
# ⚠️ 残余（故意留白、不猜）：本行 `name` 最终要经 `exports["."]` 解析到**构建产物**（宿主
# ModuleLoader 契约），而当前 `exports["."]` 仍指向 `./src/index.ts`（纯函数 barrel，无 `apply`）。
# 「插件入口 + build + 切换 exports/main」随 002 T7.1 一起交付 —— 见 stack-decision.md 的
# 2026-10-09「`build` 缺口的准入条件」行。在此之前**不要**用本包做 T0.5 的装载验证。
- insert:
    - id: dsh-terminal-profiles
      name: dsh-terminal-profiles
